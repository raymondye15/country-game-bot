services:
  - type: web
    name: country-game-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: country_game
      - key: TICK_SECRET
        generateValue: true
      - key: ADMIN_ID
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
